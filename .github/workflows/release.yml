name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-14
    permissions:
      contents: write

    defaults:
      run:
        working-directory: codex-switcher

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-switcher/src-tauri

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: codex-switcher/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build (Apple Silicon)
        run: npm run tauri build -- --target aarch64-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

      - name: Build (Intel)
        run: npm run tauri build -- --target x86_64-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

      - name: Package and publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          VERSION="${TAG#v}"

          AARCH64_APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Codex Switcher.app"
          X64_APP="src-tauri/target/x86_64-apple-darwin/release/bundle/macos/Codex Switcher.app"
          AARCH64_APP_GZ="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Codex Switcher.app.tar.gz"
          X64_APP_GZ="src-tauri/target/x86_64-apple-darwin/release/bundle/macos/Codex Switcher.app.tar.gz"
          AARCH64_SIG_FILE="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Codex Switcher.app.tar.gz.sig"
          X64_SIG_FILE="src-tauri/target/x86_64-apple-darwin/release/bundle/macos/Codex Switcher.app.tar.gz.sig"

          # Build DMGs with Install.command included
          for ARCH in aarch64 x64; do
            if [ "$ARCH" = "aarch64" ]; then
              APP="$AARCH64_APP"
            else
              APP="$X64_APP"
            fi

            STAGING="dmg-staging-${ARCH}"
            mkdir -p "$STAGING"
            cp -r "$APP" "$STAGING/"
            cp src-tauri/install-helper/Install.command "$STAGING/"
            chmod +x "$STAGING/Install.command"
            ln -s /Applications "$STAGING/Applications"

            hdiutil create -volname "Codex Switcher" \
              -srcfolder "$STAGING" \
              -ov -format UDRW \
              "tmp-${ARCH}.dmg"
            hdiutil convert "tmp-${ARCH}.dmg" \
              -format UDZO \
              -o "Codex Switcher_${VERSION}_${ARCH}.dmg"
            rm -rf "$STAGING" "tmp-${ARCH}.dmg"
          done

          # Rename updater artifacts with arch suffix
          cp "$AARCH64_APP_GZ" "Codex.Switcher_${VERSION}_aarch64.app.tar.gz"
          cp "$X64_APP_GZ" "Codex.Switcher_${VERSION}_x64.app.tar.gz"

          # Read signatures into env vars for python
          export SIG_AARCH64 SIG_X64 VERSION TAG
          SIG_AARCH64=$(cat "$AARCH64_SIG_FILE")
          SIG_X64=$(cat "$X64_SIG_FILE")

          # Extract release notes from CHANGELOG.md
          export RELEASE_NOTES
          RELEASE_NOTES=$(python3 -c "
          import re, os
          version = os.environ['VERSION']
          with open('CHANGELOG.md') as f:
              text = f.read()
          pattern = rf'## \[{re.escape(version)}\][^\n]*\n(.*?)(?=\n## \[|\Z)'
          match = re.search(pattern, text, re.DOTALL)
          print(match.group(1).strip() if match else 'See CHANGELOG.md for details.')
          ")

          # Generate latest.json
          python3 -c "
          import json, os
          version = os.environ['VERSION']
          tag = os.environ['TAG']
          sig_aarch64 = os.environ['SIG_AARCH64']
          sig_x64 = os.environ['SIG_X64']
          notes = os.environ['RELEASE_NOTES']
          base = f'https://github.com/TryingOut7/Codex-Tracker/releases/download/{tag}'
          data = {
              'version': version,
              'notes': notes,
              'platforms': {
                  'darwin-aarch64': {
                      'signature': sig_aarch64,
                      'url': f'{base}/Codex.Switcher_{version}_aarch64.app.tar.gz'
                  },
                  'darwin-x86_64': {
                      'signature': sig_x64,
                      'url': f'{base}/Codex.Switcher_{version}_x64.app.tar.gz'
                  }
              }
          }
          with open('latest.json', 'w') as f:
              json.dump(data, f, indent=2)
          print('Generated latest.json')
          "

          AARCH64_DMG="Codex Switcher_${VERSION}_aarch64.dmg"
          X64_DMG="Codex Switcher_${VERSION}_x64.dmg"

          # Create draft release, or upload to existing draft if re-running
          gh release create "$TAG" \
            --title "Codex Switcher $TAG" \
            --notes "$RELEASE_NOTES" \
            --draft \
            "$AARCH64_DMG" \
            "$X64_DMG" \
            "Codex.Switcher_${VERSION}_aarch64.app.tar.gz" \
            "Codex.Switcher_${VERSION}_x64.app.tar.gz" \
            latest.json \
            2>/dev/null || \
          gh release upload "$TAG" \
            "$AARCH64_DMG" \
            "$X64_DMG" \
            "Codex.Switcher_${VERSION}_aarch64.app.tar.gz" \
            "Codex.Switcher_${VERSION}_x64.app.tar.gz" \
            latest.json \
            --clobber
