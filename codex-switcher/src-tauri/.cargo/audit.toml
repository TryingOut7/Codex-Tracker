# cargo-audit configuration. Unlike cargo-deny, cargo-audit is not
# target-aware and reads Cargo.lock literally, so it surfaces optional
# transitive deps that are never actually compiled into the macOS build.
# Each ignored advisory below is verified with `cargo tree -i <crate>`
# returning "nothing to print" for the macOS target.

[advisories]
ignore = [
    # `rsa` is only pulled in by `sqlx-mysql`, which `sqlx-macros-core`
    # declares `optional = true`. We do not enable the `mysql` feature on
    # `sqlx`, so sqlx-mysql / rsa are NOT in the build graph
    # (`cargo tree -i rsa` → "nothing to print"). This app talks to SQLite
    # only.
    "RUSTSEC-2023-0071",

    # Linux-only GTK3 bindings pulled in by Tauri's wry/tao/muda only on
    # Linux targets. The macOS build never links any of these.
    "RUSTSEC-2024-0411", # gdkwayland-sys
    "RUSTSEC-2024-0412", # gdk
    "RUSTSEC-2024-0413", # atk
    "RUSTSEC-2024-0414", # gdkx11-sys
    "RUSTSEC-2024-0415", # gtk
    "RUSTSEC-2024-0416", # atk-sys
    "RUSTSEC-2024-0417", # gdkx11
    "RUSTSEC-2024-0418", # gdk-sys
    "RUSTSEC-2024-0419", # gtk3-macros
    "RUSTSEC-2024-0420", # gtk-sys
    "RUSTSEC-2024-0429", # glib unsoundness in VariantStrIter (Linux only)

    # Build-time-only proc-macro dep of several Tauri proc-macro crates.
    "RUSTSEC-2024-0370", # proc-macro-error

    # Upstream open-i18n unic-* family pulled in by tauri-utils/urlpattern.
    # Tracking: https://github.com/rustsec/advisory-db/issues/2414
    "RUSTSEC-2025-0075", # unic-char-range
    "RUSTSEC-2025-0080", # unic-common
    "RUSTSEC-2025-0081", # unic-char-property
    "RUSTSEC-2025-0098", # unic-ucd-version
    "RUSTSEC-2025-0100", # unic-ucd-ident
]
